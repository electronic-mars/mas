ShortDescription: Switch sound between speakers and headphones from the tray.
Description: |-
  A tray utility for Windows. One click on the tray icon moves the sound to the
  next device you marked.

  It also knows when a wireless headset on a USB dongle is switched on or off,
  which Windows itself does not report — the dongle's own status report is read
  over HID, read-only. A priority device takes the sound the moment it appears
  and gives it back when it goes away, and the microphone can follow its headset.

  There is a volume mixer with per-application levels, media keys aimed at a
  player you nominate rather than the one Windows guessed, and a global shortcut
  that works over a fullscreen game.

  Nothing is collected and nothing is sent. Fifteen languages.
