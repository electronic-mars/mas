name: Wireless headset support
description: Ask for a wireless headset dongle to be recognised.
title: "Dongle: "
labels: [dongle]
body:
  - type: markdown
    attributes:
      value: >
        Windows does not report when a headset on a USB dongle is switched on or
        off — the audio endpoint stays alive either way. The dongle itself sends
        a short status report, and the program reads it once it knows what to
        look for.


        **You do not have to fill this in by hand.** Settings → Diagnostics →
        Teach this dongle walks you through switching the headset on and off
        twice, works the report out on the spot, and its "Send to the developer"
        button opens this form already filled in. Sending it is what puts your
        headset in the next release for everyone else with the same one.
  - type: input
    id: model
    attributes:
      label: Headset model
      placeholder: "HyperX Cloud Flight S"
    validations:
      required: true
  - type: input
    id: ids
    attributes:
      label: Vendor and product id
      description: >
        Device Manager → the dongle → Details → Hardware Ids, if you are filling
        this in by hand. The wizard knows it already.
      placeholder: "0951:16EA"
    validations:
      required: true
  - type: input
    id: worked
    attributes:
      label: Did the program work it out on your machine?
      description: >
        The wizard answers this for you. "no" is just as useful to send: it means
        the reports need a look by hand.
      placeholder: "yes / no"
  - type: textarea
    id: reports
    attributes:
      label: What the dongle said
      description: >
        Filled in by the wizard. By hand: Settings → Diagnostics opens the folder
        with `dongle-learn.txt`, which holds the same lines.
      render: text
    validations:
      required: true
  - type: markdown
    attributes:
      value: >
        Thank you. Devices get added as time allows — support helps me spend
        more of it here: https://github.com/sponsors/electronic-mars
