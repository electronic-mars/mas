name: release

# Builds and publishes a release for a tag like v1.0.0. The build runs on a
# clean machine rather than mine, so nothing stray ends up in the archive and
# anyone can reproduce it from the same source.
on:
  push:
    # Numbers only. A tag like v1.0.0-rc1 would reach the version resource of the
    # executable and the installer, and neither accepts anything but numbers.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  # So the whole thing can be rehearsed before a real tag exists. A workflow that
  # has never run is a workflow that does not work, and every failed attempt on a
  # real tag burns the tag name and leaves a half-made draft behind.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, for a dry run (no release is published)'
        default: '0.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - run: pip install -r requirements.txt pyinstaller

      # One number, in one place. The executable's properties and the About tab
      # read it from the package; the file names read it from the tag. If those
      # two disagree, people download 1.0.1 and the program says 1.0.0.
      - name: The tag and the package must agree on the version
        shell: pwsh
        run: |
          # Plain if/else on purpose: a ternary split across a line continuation
          # is exactly the kind of thing that parses on one PowerShell and not on
          # another, and a build machine is not the place to find that out.
          $found = Select-String -Path src/mas/__init__.py -Pattern '__version__ = "([^"]+)"'
          if (-not $found) { throw "no __version__ in src/mas/__init__.py" }
          $pkg = $found.Matches[0].Groups[1].Value
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = $pkg
            "dry run, taking the version from the package: $version"
          } else {
            $tag = "${{ github.ref_name }}" -replace '^v', ''
            "tag $tag, package $pkg"
            if ($tag -ne $pkg) {
              throw "the tag says $tag and src/mas/__init__.py says $pkg"
            }
            $version = $tag
          }
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - run: python tests/test_device_icons.py
      - run: python tests/test_smoke.py
        env:
          PYTHONPATH: src

      # The builder's work directory is clean by definition here. On a local
      # machine it is exactly what kept the previous icon inside the exe.
      - run: pyinstaller build/mas.spec --distpath build/mas --workpath build/work --noconfirm

      - name: Start the built program once
        shell: pwsh
        run: |
          $exe = "build\mas\MasterAudioSwitcher\MasterAudioSwitcher.exe"
          $dir = "$env:LOCALAPPDATA\MasterAudioSwitcher"
          $log = "$dir\mas.log"
          $p = Start-Process $exe -ArgumentList "--startup" -PassThru
          Start-Sleep -Seconds 25
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process -Id $p.Id -Force }

          # Whatever happens next, show what it wrote. A failure here that says
          # only "exit code 1" is a failure nobody can act on.
          foreach ($f in @($log, "$dir\crash.log")) {
            if (Test-Path $f) {
              "----- $f -----"
              Get-Content $f -Tail 60
            } else { "----- $f : not written -----" }
          }

          if (-not $alive) { throw "it exited on its own with $($p.ExitCode)" }
          if (-not (Test-Path $log)) { throw "it started but wrote no log" }
          $text = Get-Content $log -Raw
          # A build machine has no sound card and no desktop of its own, so a lot
          # will be missing — these three are what prove the executable is
          # assembled rather than merely present.
          #
          # The settings line is matched either way on purpose: a build machine is
          # always a first run, and a first run says "no settings yet" instead of
          # "settings loaded". Insisting on the second is what failed the first
          # time this step ever ran — the program was fine, the check was not.
          $marks = @{
            "the start line"    = "=== start"
            "the settings"      = "settings loaded|no settings yet"
            "the local bridge"  = "bridge is up"
          }
          foreach ($name in $marks.Keys) {
            if ($text -notmatch $marks[$name]) { throw "never got to: $name" }
          }
          "started, ran for 25 seconds, and said so in the log"

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DAppVersion=$env:VERSION" `
            "/DSourceDir=$PWD\build\mas\MasterAudioSwitcher" `
            "/O$PWD" build\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "the installer did not build" }

      - name: Pack the archive and the checksums
        shell: pwsh
        run: |
          $version = $env:VERSION
          $zip = "MasterAudioSwitcher-$version.zip"
          $setup = "MasterAudioSwitcher-$version-setup.exe"
          # The folder itself, not its contents: extracting into Downloads must
          # make one folder, not scatter an exe and an _internal directory.
          Compress-Archive -Path build/mas/MasterAudioSwitcher -DestinationPath $zip
          # One checksum file for both, so a person verifies whichever they took.
          $lines = @()
          foreach ($f in @($setup, $zip)) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            $lines += "$h  $f"
            if ($f -eq $setup) { "SETUP_SHA=$h" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
            else { "ZIP_SHA=$h" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          }
          $lines | Out-File -FilePath "SHA256SUMS.txt" -Encoding ascii
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP=$setup" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build the Microsoft Store package
        shell: pwsh
        run: |
          # Not attached to the release: this file goes to Partner Center by
          # hand, and the Store signs it there. It rides along as an artifact so
          # every tag has the exact package that matches it.
          python tools/make_msix.py build/mas/MasterAudioSwitcher
          if ($LASTEXITCODE -ne 0) { throw "the Store package did not build" }

      - name: Keep the Store package
        uses: actions/upload-artifact@v4
        with:
          name: store-package
          path: build/msix-out/*.msix

      - name: Sign the release and describe it for the updater
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          # The program will not install anything this key did not sign, so a
          # release published without it is a release nobody can update to.
          # Better to stop here than to find that out from the first complaint.
          if (-not $env:UPDATE_SIGNING_KEY) { throw "UPDATE_SIGNING_KEY is not set" }
          python -m pip install --quiet cryptography
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$env:SETUP"
          python tools/sign_release.py "$env:SETUP" "${{ github.ref_name }}" "$url"
          if ($LASTEXITCODE -ne 0) { throw "the release was not signed" }
          Get-Content latest.json

      - name: Publish the release
        # A dry run builds everything and publishes nothing.
        #
        # Everything else publishes for real, the moment the tag is pushed.
        # It used to stop at a draft, so that nothing reached anybody without
        # a deliberate press. In practice the press came every time anyway,
        # minutes later, and the pause only made it easy to forget a release
        # sitting finished and invisible. Pushing a version tag is itself the
        # deliberate act; the safe rehearsal is the dry run above, which builds
        # the whole thing and publishes none of it.
        if: github.event_name != 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          Windows 11, or Windows 10 with the WebView2 runtime installed.

          **$env:SETUP** — installer, per user, no administrator rights needed.
          **$env:ZIP** — the same program as a folder, if you would rather not install.

          The program lives in the tray: left click switches the sound, right click
          opens the window.

          It is not code-signed, so SmartScreen will warn about it: "More info" then
          "Run anyway". Checksums are in ``SHA256SUMS.txt``; verify with
          ``Get-FileHash <file> -Algorithm SHA256``.

          | file | SHA256 |
          |---|---|
          | $env:SETUP | ``$env:SETUP_SHA`` |
          | $env:ZIP | ``$env:ZIP_SHA`` |
          "@
          gh release create "${{ github.ref_name }}" "$env:SETUP" "$env:ZIP" "SHA256SUMS.txt" latest.json `
            --title "${{ github.ref_name }}" --notes "$notes"

      - name: Keep the files from a dry run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: dry-run
          path: |
            MasterAudioSwitcher-*.zip
            MasterAudioSwitcher-*-setup.exe
            SHA256SUMS.txt
            latest.json
